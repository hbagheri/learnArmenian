org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
kotlin.incremental=true

ksp.useKSP2=true

# LearnArm backend (TTS / STT). Override locally without committing.
# Options:
#   1. Cloudflare tunnel (HTTPS, works anywhere):
#        learnarm.apiBaseUrl=https://learnarm.hbvsoft.ir
#   2. ADB reverse (USB-attached phone, requires `adb reverse tcp:50082 tcp:50082`):
#        learnarm.apiBaseUrl=http://localhost:50082
#   3. Android emulator (host machine reachable via 10.0.2.2):
#        learnarm.apiBaseUrl=http://10.0.2.2:50082
# Cleartext for localhost/127.0.0.1/10.0.2.2 is allowed by the manifest's
# network security config; production HTTPS is the default.
learnarm.apiBaseUrl=https://learnarm.hbvsoft.ir
